<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Christine D. Famulagan — A Sunlit Bouquet</title>
    <!-- Tailwind CSS for responsive layout and delicate frosted-vellum styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playfair Display for romantic serif elegance & Plus Jakarta Sans for clean readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Soft custom scroll & gentle floating animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .animate-float-slow {
            animation: floatSlow 5s ease-in-out infinite;
        }
    </style>
</head>
<body class="m-0 p-0 min-h-screen overflow-x-hidden select-none bg-[#FFFDF7] text-stone-800 font-sans antialiased">

    <!-- Full-Viewport Interactive Botanical Canvas -->
    <div id="canvas-wrapper" class="fixed inset-0 w-full h-full z-0">
        <canvas id="bouquetCanvas" class="block w-full h-full cursor-pointer"></canvas>
    </div>

    <!-- Foreground Responsive Overlay Layout -->
    <main class="relative z-10 min-h-screen w-full flex flex-col justify-between items-center px-4 py-6 sm:py-8 pointer-events-none">
        
        <!-- Top Delicate Header Badge -->
        <header class="w-full max-w-lg flex flex-col items-center text-center pt-1 sm:pt-2">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/65 backdrop-blur-md border border-amber-200/70 shadow-sm mb-2">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                <span class="text-[11px] sm:text-xs uppercase tracking-[0.22em] text-amber-800/80 font-medium">
                    A Sunlit Bouquet Just For You
                </span>
            </div>
        </header>

        <!-- Center Spacer so the Interactive Bouquet Shines Unobstructed -->
        <div class="flex-1 w-full min-h-[300px] sm:min-h-[360px] flex items-end justify-center pb-2">
            <p id="tap-whisper" class="text-xs sm:text-sm font-serif italic text-amber-900/65 bg-white/45 backdrop-blur-sm px-3.5 py-1 rounded-full border border-amber-200/40 transition-opacity duration-700">
                Tap the flowers to make them bloom & sparkle
            </p>
        </div>

        <!-- Bottom Frosted Vellum Dedication Card & Interactive Action -->
        <section class="w-full max-w-lg pointer-events-auto animate-float-slow">
            <div class="relative overflow-hidden rounded-3xl bg-white/75 backdrop-blur-xl border border-amber-200/80 shadow-[0_20px_50px_rgba(217,119,6,0.12)] p-6 sm:p-8 text-center">
                
                <!-- Subtle Pastel Corner Glow Accents -->
                <div class="absolute -top-12 -left-12 w-32 h-32 rounded-full bg-[#FFC8DD]/35 blur-2xl pointer-events-none"></div>
                <div class="absolute -bottom-12 -right-12 w-36 h-36 rounded-full bg-[#FDE68A]/45 blur-2xl pointer-events-none"></div>

                <!-- Recipient Dedication -->
                <p class="text-xs uppercase tracking-[0.25em] text-amber-700/75 font-semibold mb-1.5">
                    With Warmest Admiration
                </p>
                <h1 class="font-serif text-2xl sm:text-4xl font-semibold text-stone-800 tracking-tight mb-3">
                   Christine D. Famulagan
                </h1>

                <!-- Ornamental Floral Divider -->
                <div class="flex items-center justify-center gap-3 my-3">
                    <span class="h-px w-12 bg-gradient-to-r from-transparent to-amber-300"></span>
                    <svg class="w-4 h-4 text-amber-500" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L14.8 8.5L22 9.3L16.5 14L18.2 21L12 17.3L5.8 21L7.5 14L2 9.3L9.2 8.5L12 2Z"/>
                    </svg>
                    <span class="h-px w-12 bg-gradient-to-l from-transparent to-amber-300"></span>
                </div>

                <!-- Heartfelt Poetic Message -->
                <p class="font-serif italic text-base sm:text-lg leading-relaxed text-stone-700 max-w-md mx-auto mb-5">
                    “"Good morning sa pinaka-gwapa nga akong nailhan. Ayaw kalimot og kaon og pamahaw ha, aron naa kay energy tibuok adlaw."”
                </p>

                <!-- Celebratory Interactive Button -->
                <div class="flex items-center justify-center">
                    <button 
                        onclick="showerWithPetals()" 
                        id="shower-btn"
                        class="group relative inline-flex items-center justify-center gap-2.5 px-6 py-3 rounded-full text-sm font-medium text-amber-950 bg-gradient-to-r from-[#FDE68A] via-[#FFD8BE] to-[#FFC8DD] hover:brightness-105 active:scale-95 transition-all duration-300 shadow-md hover:shadow-lg border border-white/80 cursor-pointer">
                        <svg class="w-4 h-4 text-amber-700 transition-transform duration-500 group-hover:rotate-45" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                        </svg>
                        <span>Shower with Petals</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        /**
         * SUNLIT BOUQUET FOR CHRISTINE D. FAMULAGAN
         * Procedural HTML5 Canvas botanical illustration featuring:
         * - Golden Fibonacci Sunflower centerpiece
         * - Lush Pastel Tulips (Blush Pink, Peach, Creamy Lemon, Soft Lavender)
         * - Flowing Arching Leaves & Pastel Satin Ribbon Bow
         * - Interactive tap bursts, drifting pastel petals, and golden sunbeams
         */

        const canvas = document.getElementById('bouquetCanvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;
        let dpr = 1;
        let time = 0;

        // Interactive Bloom & Sparkle State
        let bloomPulse = 0;         // Extra brightness & expansion on tap
        let windGust = 0;           // Breeze impulse
        let pointer = { x: 0, y: 0, targetX: 0, targetY: 0 };

        // Particle Systems
        const pollenMotes = [];
        const driftingPetals = [];
        const tapSparkles = [];

        // Pastel Tulip Palette Definitions
        const TULIP_PALETTES = {
            blushPink: {
                outerBase: '#F48FB1',
                outerMid:  '#FFC8DD',
                outerTip:  '#FFF0F5',
                innerBase: '#EC407A',
                innerTip:  '#F8BBD0',
                vein:      'rgba(219, 39, 119, 0.14)'
            },
            pastelPeach: {
                outerBase: '#FFAB91',
                outerMid:  '#FFD8BE',
                outerTip:  '#FFF3E0',
                innerBase: '#FF8A65',
                innerTip:  '#FFE0B2',
                vein:      'rgba(230, 81, 0, 0.13)'
            },
            creamyLemon: {
                outerBase: '#FBC02D',
                outerMid:  '#FFF59D',
                outerTip:  '#FFFDE7',
                innerBase: '#F9A825',
                innerTip:  '#FFF9C4',
                vein:      'rgba(202, 138, 4, 0.15)'
            },
            softLavender: {
                outerBase: '#CE93D8',
                outerMid:  '#E0BBE4',
                outerTip:  '#F3E5F5',
                innerBase: '#BA68C8',
                innerTip:  '#E1BEE7',
                vein:      'rgba(123, 31, 162, 0.13)'
            }
        };

        // Balanced Bouquet Arrangement of Tulips around the Centerpiece Sunflower
        // Coordinates are relative offsets from bouquet focal center
        const TULIP_ARRANGEMENT = [
            // Back Upper Crown Tulips
            { dx: -92,  dy: -95,  angle: -0.42, scale: 0.92, palette: 'softLavender', phase: 0.2, layer: 'back' },
            { dx: -36,  dy: -124, angle: -0.16, scale: 0.96, palette: 'blushPink',    phase: 1.1, layer: 'back' },
            { dx: 38,   dy: -122, angle: 0.18,  scale: 0.95, palette: 'creamyLemon',  phase: 2.0, layer: 'back' },
            { dx: 94,   dy: -92,  angle: 0.44,  scale: 0.92, palette: 'pastelPeach',  phase: 2.8, layer: 'back' },

            // Mid Lateral Framing Tulips
            { dx: -126, dy: -28,  angle: -0.66, scale: 0.98, palette: 'pastelPeach',  phase: 0.7, layer: 'mid' },
            { dx: 126,  dy: -26,  angle: 0.66,  scale: 0.98, palette: 'softLavender', phase: 1.9, layer: 'mid' },

            // Foreground Lower Nestling Tulips
            { dx: -102, dy: 48,   angle: -0.52, scale: 1.02, palette: 'creamyLemon',  phase: 1.4, layer: 'front' },
            { dx: -46,  dy: 78,   angle: -0.22, scale: 0.95, palette: 'blushPink',    phase: 2.5, layer: 'front' },
            { dx: 48,   dy: 76,   angle: 0.24,  scale: 0.95, palette: 'pastelPeach',  phase: 3.1, layer: 'front' },
            { dx: 104,  dy: 46,   angle: 0.54,  scale: 1.02, palette: 'blushPink',    phase: 0.9, layer: 'front' }
        ];

        /**
         * Golden Ambient Pollen Particle
         */
        class GoldenMote {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = Math.random() * (width || window.innerWidth);
                this.y = initial ? Math.random() * (height || window.innerHeight) : (height || window.innerHeight) + 15;
                this.r = Math.random() * 2.8 + 1.1;
                this.vy = -(Math.random() * 0.4 + 0.15);
                this.vx = (Math.random() - 0.5) * 0.25;
                this.phase = Math.random() * Math.PI * 2;
                this.alpha = Math.random() * 0.55 + 0.25;
            }
            update(wind) {
                this.phase += 0.025;
                this.x += this.vx + Math.sin(this.phase) * 0.35 + wind * 1.1;
                this.y += this.vy;
                if (this.y < -15) this.reset(false);
                if (this.x < -15) this.x = width + 15;
                if (this.x > width + 15) this.x = -15;
            }
            draw(ctx) {
                const glow = 0.65 + 0.35 * Math.sin(time * 2.5 + this.phase);
                ctx.save();
                ctx.globalAlpha = this.alpha * glow;
                ctx.fillStyle = '#F59E0B';
                ctx.shadowColor = '#FBBF24';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        /**
         * Drifting Pastel Petal Particle (Ambient + Celebratory Shower)
         */
        class DriftingPetal {
            constructor(burst = false, originX = null, originY = null) {
                const colors = ['#FFC8DD', '#FFD8BE', '#FFF59D', '#E0BBE4', '#FDE68A'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.burst = burst;

                if (burst && originX !== null && originY !== null) {
                    this.x = originX + (Math.random() - 0.5) * 60;
                    this.y = originY + (Math.random() - 0.5) * 60;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4.5 + 1.5;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed - 1.5;
                } else {
                    this.x = Math.random() * (width || window.innerWidth);
                    this.y = -20 - Math.random() * (height * 0.5);
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = Math.random() * 1.1 + 0.65;
                }

                this.size = Math.random() * 7 + 5;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.05;
                this.swayPhase = Math.random() * Math.PI * 2;
                this.alpha = 0.88;
            }
            update(wind) {
                this.swayPhase += 0.03;
                this.rotation += this.rotSpeed;

                if (this.burst) {
                    this.vx *= 0.96;
                    this.vy = this.vy * 0.96 + 0.055; // Gentle gravity float
                    this.x += this.vx + Math.sin(this.swayPhase) * 0.5 + wind;
                    this.y += this.vy;
                    this.alpha -= 0.0045;
                } else {
                    this.x += this.vx + Math.sin(this.swayPhase) * 0.65 + wind * 1.4;
                    this.y += this.vy;
                    if (this.y > height + 25) {
                        this.y = -20;
                        this.x = Math.random() * width;
                    }
                }
            }
            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(1, 0.65 + 0.35 * Math.sin(this.swayPhase));
                ctx.globalAlpha = Math.max(0, this.alpha);

                ctx.fillStyle = this.color;
                ctx.shadowColor = 'rgba(217, 119, 6, 0.15)';
                ctx.shadowBlur = 4;

                // Soft teardrop petal silhouette
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.bezierCurveTo(this.size * 0.8, -this.size * 0.3, this.size * 0.6, this.size * 0.7, 0, this.size);
                ctx.bezierCurveTo(-this.size * 0.6, this.size * 0.7, -this.size * 0.8, -this.size * 0.3, 0, -this.size);
                ctx.fill();
                ctx.restore();
            }
        }

        /**
         * Golden Sparkle Particle on Tap
         */
        class SparkleStar {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3.5 + 1.0;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 0.8;
                this.size = Math.random() * 5 + 3;
                this.life = 1.0;
                this.decay = Math.random() * 0.022 + 0.015;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.life -= this.decay;
            }
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.globalAlpha = this.life;
                ctx.fillStyle = '#F59E0B';
                ctx.shadowColor = '#FDE68A';
                ctx.shadowBlur = 10;

                // 4-point diamond sparkle
                const s = this.size * this.life;
                ctx.beginPath();
                ctx.moveTo(0, -s);
                ctx.quadraticCurveTo(0, 0, s, 0);
                ctx.quadraticCurveTo(0, 0, 0, s);
                ctx.quadraticCurveTo(0, 0, -s, 0);
                ctx.quadraticCurveTo(0, 0, 0, -s);
                ctx.fill();
                ctx.restore();
            }
        }

        /**
         * Resize Canvas for Crisp Retina Rendering
         */
        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        /**
         * Initialize Background Motes & Gentle Ambient Petals
         */
        function initParticles() {
            pollenMotes.length = 0;
            driftingPetals.length = 0;
            for (let i = 0; i < 42; i++) pollenMotes.push(new GoldenMote());
            for (let i = 0; i < 16; i++) driftingPetals.push(new DriftingPetal(false));
        }

        /**
         * Trigger Interactive Bloom Pulse & Burst at Coordinates
         */
        function triggerBloomBurst(x, y, petalCount = 14) {
            bloomPulse = 1.0;
            windGust = (Math.random() - 0.5) * 0.7;

            for (let i = 0; i < 18; i++) {
                tapSparkles.push(new SparkleStar(x, y));
            }
            for (let i = 0; i < petalCount; i++) {
                driftingPetals.push(new DriftingPetal(true, x, y));
            }

            const whisper = document.getElementById('tap-whisper');
            if (whisper) whisper.style.opacity = '0';
        }

        /**
         * Celebratory "Shower with Petals" Button Action
         */
        window.showerWithPetals = function() {
            bloomPulse = 1.2;
            windGust = 0.5;
            const centerX = width * 0.5;
            const bouquetY = getBouquetCenterY();

            // Cascade of pastel petals across the top & around the bouquet
            for (let i = 0; i < 45; i++) {
                const spawnX = Math.random() * width;
                const spawnY = Math.random() * (height * 0.45);
                driftingPetals.push(new DriftingPetal(true, spawnX, spawnY));
            }
            for (let i = 0; i < 24; i++) {
                tapSparkles.push(new SparkleStar(
                    centerX + (Math.random() - 0.5) * 180,
                    bouquetY + (Math.random() - 0.5) * 140
                ));
            }
        };

        /**
         * Calculate Responsive Vertical Position for Bouquet Centerpiece
         * Keeps the flowers centered cleanly above the dedication card on mobile & desktop
         */
        function getBouquetCenterY() {
            if (width < 640) {
                return height * 0.34;
            }
            return height * 0.37;
        }

        /**
         * Draw Warm Cream/Ivory Sunrise Sky & Radiant Golden Sunbeams
         */
        function drawSunriseBackground(centerX, centerY) {
            // Warm cream to soft golden ivory gradient
            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#FFFDF7');
            bgGrad.addColorStop(0.45, '#FFF8E7');
            bgGrad.addColorStop(1, '#FFF1D0');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Soft pastel washes in upper corners
            const peachGlow = ctx.createRadialGradient(width * 0.15, height * 0.15, 10, width * 0.15, height * 0.15, width * 0.45);
            peachGlow.addColorStop(0, 'rgba(255, 216, 190, 0.32)');
            peachGlow.addColorStop(1, 'rgba(255, 216, 190, 0)');
            ctx.fillStyle = peachGlow;
            ctx.fillRect(0, 0, width, height);

            const pinkGlow = ctx.createRadialGradient(width * 0.85, height * 0.2, 10, width * 0.85, height * 0.2, width * 0.45);
            pinkGlow.addColorStop(0, 'rgba(255, 200, 221, 0.28)');
            pinkGlow.addColorStop(1, 'rgba(255, 200, 221, 0)');
            ctx.fillStyle = pinkGlow;
            ctx.fillRect(0, 0, width, height);

            // Rotating Sunbeams radiating behind the bouquet
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(time * 0.03);
            const rayCount = 12;
            const maxRayLen = Math.max(width, height) * 0.75;
            for (let i = 0; i < rayCount; i++) {
                ctx.rotate((Math.PI * 2) / rayCount);
                const rayGrad = ctx.createLinearGradient(0, 0, 0, -maxRayLen);
                rayGrad.addColorStop(0, 'rgba(253, 224, 71, 0.22)');
                rayGrad.addColorStop(0.6, 'rgba(254, 243, 199, 0.07)');
                rayGrad.addColorStop(1, 'rgba(254, 243, 199, 0)');
                ctx.fillStyle = rayGrad;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-42, -maxRayLen);
                ctx.lineTo(42, -maxRayLen);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            // Warm Radial Halo directly behind the Sunflower
            const haloRadius = (230 + bloomPulse * 45 + Math.sin(time * 1.5) * 10);
            const sunHalo = ctx.createRadialGradient(centerX, centerY, 15, centerX, centerY, haloRadius);
            sunHalo.addColorStop(0, 'rgba(253, 224, 71, 0.48)');
            sunHalo.addColorStop(0.55, 'rgba(255, 216, 190, 0.24)');
            sunHalo.addColorStop(1, 'rgba(255, 253, 247, 0)');
            ctx.fillStyle = sunHalo;
            ctx.beginPath();
            ctx.arc(centerX, centerY, haloRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        /**
         * Draw Bouquet Stems, Arching Botanical Leaves, Soft Wrapping & Satin Ribbon Bow
         */
        function drawBouquetStemsAndRibbon(centerX, centerY, tieY, sway, scale) {
            ctx.save();

            // 1. Soft Pastel Vellum Bouquet Wrap Cone behind the stems
            ctx.save();
            const wrapGrad = ctx.createLinearGradient(centerX, centerY - 60 * scale, centerX, tieY + 75 * scale);
            wrapGrad.addColorStop(0, 'rgba(255, 248, 235, 0.85)');
            wrapGrad.addColorStop(0.6, 'rgba(255, 228, 230, 0.72)');
            wrapGrad.addColorStop(1, 'rgba(255, 216, 190, 0.85)');

            ctx.fillStyle = wrapGrad;
            ctx.strokeStyle = 'rgba(251, 191, 36, 0.25)';
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(centerX - 155 * scale + sway * 16, centerY - 40 * scale);
            ctx.quadraticCurveTo(centerX, centerY - 125 * scale, centerX + 155 * scale + sway * 16, centerY - 40 * scale);
            ctx.lineTo(centerX + 26 * scale, tieY);
            ctx.lineTo(centerX + 46 * scale, tieY + 68 * scale);
            ctx.quadraticCurveTo(centerX, tieY + 78 * scale, centerX - 46 * scale, tieY + 68 * scale);
            ctx.lineTo(centerX - 26 * scale, tieY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            // 2. Slender Botanical Stems converging at the Ribbon Tie Point
            TULIP_ARRANGEMENT.forEach((tulip) => {
                const headX = centerX + (tulip.dx + sway * 24) * scale;
                const headY = centerY + tulip.dy * scale;
                const bottomX = centerX - tulip.dx * 0.16 * scale;
                const bottomY = tieY + 64 * scale;

                const stemGrad = ctx.createLinearGradient(headX, headY, bottomX, bottomY);
                stemGrad.addColorStop(0, '#65A30D');
                stemGrad.addColorStop(0.65, '#4D7C0F');
                stemGrad.addColorStop(1, '#365314');

                ctx.strokeStyle = stemGrad;
                ctx.lineWidth = 4.2 * scale;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(headX, headY + 12 * scale);
                ctx.quadraticCurveTo(
                    centerX + tulip.dx * 0.35 * scale,
                    (headY + tieY) * 0.5,
                    centerX + tulip.dx * 0.08 * scale,
                    tieY
                );
                ctx.lineTo(bottomX, bottomY);
                ctx.stroke();
            });

            // Central Thick Sunflower Stem
            ctx.strokeStyle = '#3F6212';
            ctx.lineWidth = 7.5 * scale;
            ctx.beginPath();
            ctx.moveTo(centerX + sway * 16 * scale, centerY + 15 * scale);
            ctx.lineTo(centerX, tieY + 68 * scale);
            ctx.stroke();

            // 3. Graceful Arching Tulip Leaves framing the sides
            const leaves = [
                { x: -35, y: 55, angle: -0.85, len: 145, wid: 26 },
                { x: 35,  y: 55, angle: 0.85,  len: 145, wid: 26 },
                { x: -25, y: 80, angle: -0.58, len: 125, wid: 22 },
                { x: 25,  y: 80, angle: 0.58,  len: 125, wid: 22 },
                { x: -45, y: 15, angle: -1.15, len: 120, wid: 20 },
                { x: 45,  y: 15, angle: 1.15,  len: 120, wid: 20 }
            ];

            leaves.forEach((leaf, idx) => {
                ctx.save();
                const lx = centerX + leaf.x * scale;
                const ly = centerY + leaf.y * scale;
                const leafFlutter = Math.sin(time * 1.4 + idx) * 0.04 + sway * 0.25;
                ctx.translate(lx, ly);
                ctx.rotate(leaf.angle + leafFlutter);

                const lLen = leaf.len * scale;
                const lWid = leaf.wid * scale;
                const leafGrad = ctx.createLinearGradient(0, 0, 0, -lLen);
                leafGrad.addColorStop(0, '#4D7C0F');
                leafGrad.addColorStop(0.6, '#84CC16');
                leafGrad.addColorStop(1, '#BEF264');

                ctx.fillStyle = leafGrad;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(-lWid, -lLen * 0.45, 0, -lLen);
                ctx.quadraticCurveTo(lWid * 0.7, -lLen * 0.45, 0, 0);
                ctx.fill();

                // Delicate leaf center vein
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, -4);
                ctx.lineTo(0, -lLen * 0.85);
                ctx.stroke();
                ctx.restore();
            });

            // 4. Soft Pastel Cream & Blush Satin Ribbon Bow at Tie Point
            drawSatinRibbonBow(centerX, tieY, scale, sway);

            ctx.restore();
        }

        /**
         * Draw Delicate Satin Ribbon Bow tying the Bouquet Together
         */
        function drawSatinRibbonBow(x, y, scale, sway) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            const tailFlutter = Math.sin(time * 1.8) * 3 + sway * 12;

            // Flowing Ribbon Tails
            const tailGrad = ctx.createLinearGradient(0, 0, 0, 62);
            tailGrad.addColorStop(0, '#FBCFE8');
            tailGrad.addColorStop(1, '#FDE68A');
            ctx.fillStyle = tailGrad;

            // Left Tail
            ctx.beginPath();
            ctx.moveTo(-4, 4);
            ctx.quadraticCurveTo(-24, 34, -32 + tailFlutter, 62);
            ctx.lineTo(-18 + tailFlutter, 56);
            ctx.quadraticCurveTo(-12, 30, 0, 6);
            ctx.fill();

            // Right Tail
            ctx.beginPath();
            ctx.moveTo(4, 4);
            ctx.quadraticCurveTo(24, 34, 32 + tailFlutter, 62);
            ctx.lineTo(18 + tailFlutter, 56);
            ctx.quadraticCurveTo(12, 30, 0, 6);
            ctx.fill();

            // Satin Wrap Band around Stems
            const bandGrad = ctx.createLinearGradient(-22, 0, 22, 0);
            bandGrad.addColorStop(0, '#F9A8D4');
            bandGrad.addColorStop(0.5, '#FFFBEB');
            bandGrad.addColorStop(1, '#F9A8D4');
            ctx.fillStyle = bandGrad;
            ctx.beginPath();
            ctx.roundRect(-21, -7, 42, 14, 6);
            ctx.fill();

            // Left & Right Bow Loops
            const loopGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, 38);
            loopGrad.addColorStop(0, '#FFFBEB');
            loopGrad.addColorStop(0.6, '#FBCFE8');
            loopGrad.addColorStop(1, '#F472B6');
            ctx.fillStyle = loopGrad;
            ctx.shadowColor = 'rgba(219, 39, 119, 0.15)';
            ctx.shadowBlur = 8;

            // Left Loop
            ctx.beginPath();
            ctx.moveTo(-4, 0);
            ctx.bezierCurveTo(-36, -24, -44, 18, -4, 4);
            ctx.fill();

            // Right Loop
            ctx.beginPath();
            ctx.moveTo(4, 0);
            ctx.bezierCurveTo(36, -24, 44, 18, 4, 4);
            ctx.fill();

            // Center Satin Knot
            ctx.fillStyle = '#FCE7F3';
            ctx.strokeStyle = 'rgba(244, 114, 182, 0.35)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(-8, -8, 16, 16, 5);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        /**
         * Draw Individual Cupped Pastel Tulip Blossom
         */
        function drawPastelTulip(x, y, angle, tulipScale, paletteKey, phase) {
            const pal = TULIP_PALETTES[paletteKey];
            const flutter = Math.sin(time * 1.6 + phase) * 0.045;
            const pulseScale = 1 + bloomPulse * 0.08;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle + flutter);
            ctx.scale(tulipScale * pulseScale, tulipScale * pulseScale);

            const h = 54;
            const w = 24;

            // 1. Inner Back Petal (adds depth inside the tulip cup)
            const innerGrad = ctx.createLinearGradient(0, 0, 0, -h);
            innerGrad.addColorStop(0, pal.innerBase);
            innerGrad.addColorStop(1, pal.innerTip);
            ctx.fillStyle = innerGrad;
            ctx.beginPath();
            ctx.moveTo(-w * 0.55, -h * 0.35);
            ctx.quadraticCurveTo(0, -h * 1.12, w * 0.55, -h * 0.35);
            ctx.closePath();
            ctx.fill();

            // 2. Left Overlapping Cupped Petal
            const leftGrad = ctx.createLinearGradient(-w, 0, 0, -h);
            leftGrad.addColorStop(0, pal.outerBase);
            leftGrad.addColorStop(0.55, pal.outerMid);
            leftGrad.addColorStop(1, pal.outerTip);

            ctx.fillStyle = leftGrad;
            ctx.shadowColor = 'rgba(120, 53, 15, 0.12)';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-w * 1.25, -h * 0.12, -w * 1.15, -h * 0.78, -w * 0.18, -h * 0.98);
            ctx.quadraticCurveTo(w * 0.25, -h * 0.55, 0, 0);
            ctx.fill();

            // 3. Right Overlapping Cupped Petal
            const rightGrad = ctx.createLinearGradient(w, 0, 0, -h);
            rightGrad.addColorStop(0, pal.outerBase);
            rightGrad.addColorStop(0.55, pal.outerMid);
            rightGrad.addColorStop(1, pal.outerTip);

            ctx.fillStyle = rightGrad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(w * 1.25, -h * 0.12, w * 1.15, -h * 0.78, w * 0.18, -h * 0.98);
            ctx.quadraticCurveTo(-w * 0.25, -h * 0.55, 0, 0);
            ctx.fill();

            // 4. Center Front Sculpted Tulip Petal
            const centerGrad = ctx.createLinearGradient(0, 0, 0, -h);
            centerGrad.addColorStop(0, pal.outerBase);
            centerGrad.addColorStop(0.5, pal.outerMid);
            centerGrad.addColorStop(1, pal.outerTip);

            ctx.fillStyle = centerGrad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-w * 0.85, -h * 0.22, -w * 0.65, -h * 0.82, 0, -h * 1.02);
            ctx.bezierCurveTo(w * 0.65, -h * 0.82, w * 0.85, -h * 0.22, 0, 0);
            ctx.fill();

            // Silky Rim Light & Subtle Center Vein
            ctx.shadowColor = 'transparent';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.lineWidth = 0.9;
            ctx.stroke();

            ctx.strokeStyle = pal.vein;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(0, -6);
            ctx.lineTo(0, -h * 0.86);
            ctx.stroke();

            ctx.restore();
        }

        /**
         * Draw Radiant Multi-Layered Sunflower Centerpiece with Fibonacci Seed Disc
         */
        function drawCenterpieceSunflower(x, y, scale, sway) {
            const pulseScale = 1 + bloomPulse * 0.09 + Math.sin(time * 1.4) * 0.015;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(sway * 0.25 + pointer.x * 0.04);
            ctx.scale(scale * pulseScale, scale * pulseScale);

            // Three lush overlapping rings of golden-amber sunflower petals
            const petalLayers = [
                { count: 24, len: 108, wid: 21, base: '#B45309', mid: '#F59E0B', tip: '#FEF08A', rotOffset: 0 },
                { count: 22, len: 94,  wid: 19, base: '#D97706', mid: '#FBBF24', tip: '#FEF9C3', rotOffset: 0.14 },
                { count: 18, len: 76,  wid: 16, base: '#EA580C', mid: '#FACC15', tip: '#FFFFFF', rotOffset: 0.28 }
            ];

            petalLayers.forEach((layer, lIdx) => {
                for (let i = 0; i < layer.count; i++) {
                    const angle = (i / layer.count) * Math.PI * 2 + layer.rotOffset;
                    const flutter = Math.sin(time * 2.0 + i * 0.9 + lIdx) * 0.025;

                    ctx.save();
                    ctx.rotate(angle + flutter);

                    const pGrad = ctx.createLinearGradient(0, -24, 0, -layer.len);
                    pGrad.addColorStop(0, layer.base);
                    pGrad.addColorStop(0.55, layer.mid);
                    pGrad.addColorStop(1, layer.tip);

                    ctx.fillStyle = pGrad;
                    ctx.shadowColor = 'rgba(146, 64, 14, 0.18)';
                    ctx.shadowBlur = 8;

                    ctx.beginPath();
                    ctx.moveTo(0, -22);
                    ctx.bezierCurveTo(
                        -layer.wid * 0.85, -layer.len * 0.42,
                        -layer.wid * 0.45, -layer.len * 0.86,
                        0, -layer.len
                    );
                    ctx.bezierCurveTo(
                        layer.wid * 0.45, -layer.len * 0.86,
                        layer.wid * 0.85, -layer.len * 0.42,
                        0, -22
                    );
                    ctx.fill();

                    // Delicate petal rib lines
                    ctx.shadowColor = 'transparent';
                    ctx.strokeStyle = 'rgba(180, 83, 9, 0.18)';
                    ctx.lineWidth = 0.7;
                    ctx.beginPath();
                    ctx.moveTo(0, -28);
                    ctx.lineTo(0, -layer.len * 0.88);
                    ctx.stroke();

                    ctx.restore();
                }
            });

            // Warm Velvety Brown & Amber Seed Disc
            const discRadius = 38;
            const discGrad = ctx.createRadialGradient(-4, -4, 4, 0, 0, discRadius);
            discGrad.addColorStop(0, '#451A03');
            discGrad.addColorStop(0.72, '#78350F');
            discGrad.addColorStop(1, '#92400E');

            ctx.fillStyle = discGrad;
            ctx.shadowColor = 'rgba(69, 26, 3, 0.35)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(0, 0, discRadius, 0, Math.PI * 2);
            ctx.fill();

            // Golden Ratio Phyllotaxis Spiral Seeds (137.508 deg)
            ctx.shadowColor = 'transparent';
            const goldenAngle = 2.39996323;
            const seedCount = 125;
            for (let i = 0; i < seedCount; i++) {
                const r = Math.sqrt(i / seedCount) * (discRadius - 3);
                const theta = i * goldenAngle;
                const sx = Math.cos(theta) * r;
                const sy = Math.sin(theta) * r;
                const isOuterRing = i > seedCount * 0.72;

                ctx.fillStyle = isOuterRing ? '#FACC15' : '#D97706';
                ctx.beginPath();
                ctx.arc(sx, sy, isOuterRing ? 1.85 : 1.35, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        /**
         * Main Animation Loop
         */
        function animate() {
            time += 0.016;

            // Smooth decay of interactive tap bloom & wind impulse
            bloomPulse *= 0.93;
            windGust *= 0.95;

            const gentleWind = Math.sin(time * 1.05) * 0.04 + Math.cos(time * 0.5) * 0.025 + windGust * 0.1;

            // Smooth pointer parallax
            pointer.x += (pointer.targetX - pointer.x) * 0.06;
            pointer.y += (pointer.targetY - pointer.y) * 0.06;

            // Responsive scaling so the entire bouquet fits harmoniously on phones & desktops
            const minDim = Math.min(width, height);
            const scale = width < 640
                ? Math.max(0.74, Math.min(0.96, width / 430))
                : Math.max(0.85, Math.min(1.18, minDim / 680));

            const centerX = width * 0.5 + pointer.x * 12;
            const centerY = getBouquetCenterY() + pointer.y * 8;
            const tieY = centerY + 135 * scale;

            // 1. Sunrise Sky & Golden Sunbeams
            drawSunriseBackground(centerX, centerY);

            // 2. Stems, Arching Leaves & Satin Ribbon Bow
            drawBouquetStemsAndRibbon(centerX, centerY, tieY, gentleWind, scale);

            // 3. Back & Mid Layer Pastel Tulips
            TULIP_ARRANGEMENT.filter(t => t.layer !== 'front').forEach((tulip) => {
                const tx = centerX + (tulip.dx + gentleWind * 24) * scale;
                const ty = centerY + tulip.dy * scale;
                drawPastelTulip(tx, ty, tulip.angle, tulip.scale * scale, tulip.palette, tulip.phase);
            });

            // 4. Centerpiece Golden Sunflower
            drawCenterpieceSunflower(
                centerX + gentleWind * 16 * scale,
                centerY,
                scale,
                gentleWind
            );

            // 5. Front Layer Pastel Tulips nestling around the Sunflower
            TULIP_ARRANGEMENT.filter(t => t.layer === 'front').forEach((tulip) => {
                const tx = centerX + (tulip.dx + gentleWind * 24) * scale;
                const ty = centerY + tulip.dy * scale;
                drawPastelTulip(tx, ty, tulip.angle, tulip.scale * scale, tulip.palette, tulip.phase);
            });

            // 6. Floating Golden Pollen Motes
            for (let i = 0; i < pollenMotes.length; i++) {
                pollenMotes[i].update(gentleWind);
                pollenMotes[i].draw(ctx);
            }

            // 7. Drifting Pastel Flower Petals
            for (let i = driftingPetals.length - 1; i >= 0; i--) {
                driftingPetals[i].update(gentleWind);
                driftingPetals[i].draw(ctx);
                if (driftingPetals[i].burst && driftingPetals[i].alpha <= 0) {
                    driftingPetals.splice(i, 1);
                }
            }

            // 8. Interactive Tap Sparkles
            for (let i = tapSparkles.length - 1; i >= 0; i--) {
                tapSparkles[i].update();
                tapSparkles[i].draw(ctx);
                if (tapSparkles[i].life <= 0) {
                    tapSparkles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Event Listeners
        window.addEventListener('resize', resizeCanvas);

        canvas.addEventListener('click', (e) => {
            triggerBloomBurst(e.clientX, e.clientY, 16);
        });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                triggerBloomBurst(touch.clientX, touch.clientY, 16);
            }
        }, { passive: true });

        window.addEventListener('mousemove', (e) => {
            pointer.targetX = (e.clientX / width - 0.5) * 2;
            pointer.targetY = (e.clientY / height - 0.5) * 2;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                pointer.targetX = (e.touches[0].clientX / width - 0.5) * 2;
                pointer.targetY = (e.touches[0].clientY / height - 0.5) * 2;
            }
        }, { passive: true });

        // Initialize on Load
        window.onload = function() {
            resizeCanvas();
            initParticles();
            animate();
        };
    </script>
</body>
